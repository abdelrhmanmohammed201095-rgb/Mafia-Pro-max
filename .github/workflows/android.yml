name: Build Android APK with Capacitor

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and Setup Capacitor
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build
          
          # لو مجلد أندرويد مش موجود، بننشئه بطريقة نظيفة من غير مشاكل الـ CLI
          if [ ! -d "android" ]; then
            echo "Initializing Capacitor config..."
            # إنشاء ملف إعدادات سريع كاباسيتور يريحنا من الأسئلة التفاعلية
            echo '{"appId": "com.boodydevs.mafiapromax", "appName": "Mafia Pro Max", "webDir": "dist"}' > capacitor.config.json
            npx cap add android
          else
            npx cap update android
          fi

      - name: Setup Android SDK and Build APK
        run: |
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-pro-max-release
          path: android/app/build/outputs/apk/release/*.apk
