name: Build Android APK with Capacitor

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies and Setup Capacitor
        run: |
          npm install
          npm install @capacitor/core@5.7.4 @capacitor/cli@5.7.4 @capacitor/android@5.7.4
          npm run build
          
          if [ ! -d "android" ]; then
            echo "Initializing Capacitor config..."
            echo '{"appId": "com.boodydevs.mafiapromax", "appName": "Mafia Pro Max", "webDir": "dist"}' > capacitor.config.json
            npx cap add android
          else
            npx cap update android
          fi

      - name: Setup Android SDK and Build APK
        env:
          ANDROID_HOME: /home/runner/android-sdk
          ANDROID_SDK_ROOT: /home/runner/android-sdk
        run: |
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          
          export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools
          
          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

          cd android
          
          # تثبيت مسار الـ SDK في ملف local.properties لمنع أي تعارض نهائياً
          echo "sdk.dir=/home/runner/android-sdk" > local.properties
          
          # مسح الكاش القديم
          rm -rf ~/.gradle/caches/
          
          chmod +x gradlew
          # بناء الـ APK وتخطى مهام الـ Lint اللي بتعمل مشاكل
          ./gradlew assembleRelease -x lintVitalReportRelease --refresh-dependencies --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mafia-pro-max-release
          path: android/app/build/outputs/apk/release/*.apk
